<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEO Kalaburagi North Education Portal</title>

    <link rel="stylesheet" href="style.css">

    <!-- Firebase -->
    <script type="module" src="firebase.js"></script>
    <script type="module" src="script.js"></script>
    <script type="module" src="admin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<style>
/* RED NAVIGATION BAR */

.menu {
    width: 100%;
    background: #e53935 !important;
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 18px 10px !important;
    box-sizing: border-box;
}

.menu button {
    background: transparent !important;
    color: white !important;
    border: none !important;
    border-radius: 0 !important;
    font-size: 22px !important;
    font-weight: bold !important;
    padding: 18px 30px !important;
    min-width: 130px !important;
    cursor: pointer;
}

.menu button:hover {
    background: #c62828 !important;
}

@media (max-width: 700px) {
    .menu {
        flex-wrap: wrap;
        gap: 5px;
    }

    .menu button {
        font-size: 17px !important;
        padding: 12px 16px !important;
        min-width: 100px !important;
    }
}
</style>

<header class="header">
    <h1>BEO Kalaburagi North Education Portal</h1>

    <nav class="menu">
        <button onclick="showHome()">Home</button>
        <button onclick="showGallery()">Gallery</button>
        <button onclick="showSchoolSelector()">🏫 Schools</button>
        <button onclick="showDISESearch()">
  🔎 DISE Search
</button>
        <button onclick="showCirculars()">Circular</button>
        <button onclick="adminLogin()">Admin</button>
    </nav>
</header>

<div id="content"></div>

<footer>
    © 2026 BEO Kalaburagi North
</footer>



</body>
</html>
