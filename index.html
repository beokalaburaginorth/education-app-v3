<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEO Kalaburagi North Education Portal</title>

    <link rel="stylesheet" href="style.css">

    <!-- Firebase -->
    <script type="module" src="firebase.js"></script>
    <script type="module" src="script.js"></script>
    <script type="module" src="admin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
<style>
.menu button {
    font-size: 20px !important;
    font-weight: bold !important;
    padding: 16px 28px !important;
    min-width: 135px !important;
    min-height: 58px !important;
    color: white !important;
    border: none !important;
    border-radius: 10px !important;
    cursor: pointer;
}

.menu button:nth-child(1) {
    background: #1565C0 !important;
}

.menu button:nth-child(2) {
    background: #6A1B9A !important;
}

.menu button:nth-child(3) {
    background: #2E7D32 !important;
}

.menu button:nth-child(4) {
    background: #00838F !important;
}

.menu button:nth-child(5) {
    background: #EF6C00 !important;
}

.menu button:nth-child(6) {
    background: #455A64 !important;
}

.menu button:hover {
    transform: scale(1.05);
}
</style>

<header class="header">
    <h1>BEO Kalaburagi North Education Portal</h1>

    <nav class="menu">
        <button onclick="showHome()">Home</button>
        <button onclick="showGallery()">Gallery</button>
        <button onclick="showSchoolSelector()">🏫 Schools</button>
        <button onclick="showDISESearch()">
  🔎 DISE Search
</button>
        <button onclick="showCirculars()">Circular</button>
        <button onclick="adminLogin()">Admin</button>
    </nav>
</header>

<div id="content"></div>

<footer>
    © 2026 BEO Kalaburagi North
</footer>



</body>
</html>
