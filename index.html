<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEO KALABURAGI NORTH EDUCATION PORTAL</title>

    <link rel="stylesheet" href="style.css">

    <!-- Firebase -->
    <script type="module" src="firebase.js"></script>
    <script type="module" src="script.js"></script>
    <script type="module" src="admin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<style>
/* DARK BLUE NAVIGATION BAR */

.menu button {
    background: linear-gradient(
        145deg,
        #42A5F5,
        #1976D2
    ) !important;

    color: white !important;

    font-size: 20px !important;
    font-weight: bold !important;

    padding: 15px 28px !important;
    min-width: 135px !important;
    min-height: 55px !important;

    border: 1px solid #64B5F6 !important;
    border-radius: 12px !important;

    box-shadow:
        0 5px 0 #0D47A1,
        0 8px 15px rgba(0,0,0,0.25),
        inset 0 1px 2px rgba(255,255,255,0.5) !important;

    cursor: pointer;
    transition: all 0.2s ease;
}

/* Hover - Highlight */
.menu button:hover {
    background: linear-gradient(
        145deg,
        #64B5F6,
        #2196F3
    ) !important;

    transform: translateY(-3px);

    box-shadow:
        0 8px 0 #0D47A1,
        0 12px 20px rgba(0,0,0,0.30),
        0 0 12px rgba(100,181,246,0.7) !important;
}

/* Click */
.menu button:active {
    transform: translateY(3px);

    box-shadow:
        0 2px 0 #0D47A1,
        0 4px 8px rgba(0,0,0,0.2) !important;
}

}
</style>

<header class="header">

    <img src="Seal_of_Karnataka.png" class="gov-logo">

    <h1>BEO KALABURAGI NORTH EDUCATION PORTAL</h1>

    <nav class="menu">
        <button onclick="showHome()">Home</button>
        <button onclick="showGallery()">Gallery</button>
        <button onclick="showSchoolSelector()">🏫 Schools</button>
        <button onclick="showDISESearch()">
  🔎 DISE Search
</button>
        <button onclick="showCirculars()">Circular</button>
        <button onclick="adminLogin()">Admin</button>
    </nav>
</header>

<div id="content"></div>

<footer>
    © 2026 BEO Kalaburagi North
</footer>



</body>
</html>
